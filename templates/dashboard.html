<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Trading Bot</title>
    <script src="/static/lightweight-charts.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #131722;
            color: #d1d4dc;
        }
        .header {
            background: #1e222d;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e39;
        }
        .price-info { display: flex; gap: 20px; align-items: center; }
        .price-current { font-size: 24px; font-weight: bold; color: #fff; }
        .price-change { padding: 4px 8px; border-radius: 4px; font-size: 14px; }
        .up { background: rgba(0,230,118,0.2); color: #00e676; }
        .down { background: rgba(255,82,82,0.2); color: #ff5252; }
        .toolbar {
            background: #1e222d;
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #2a2e39;
        }
        .tf-btn {
            padding: 6px 14px;
            background: #2a2e39;
            border: none;
            border-radius: 4px;
            color: #d1d4dc;
            cursor: pointer;
        }
        .tf-btn:hover, .tf-btn.active { background: #2962ff; color: #fff; }
        .chart-wrap {
            width: 100%;
            height: 500px;
            background: #131722;
        }
        .bottom {
            background: #1e222d;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #787b86;
            border-top: 1px solid #2a2e39;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 style="color:#fff;">BTC/USD</h1>
        <div class="price-info">
            <span class="price-current" id="btc-price">Loading...</span>
            <span class="price-change up" id="price-change">+0.00%</span>
        </div>
    </div>
    <div class="toolbar">
        <button class="tf-btn active" data-tf="1m">1m</button>
        <button class="tf-btn" data-tf="5m">5m</button>
        <button class="tf-btn" data-tf="15m">15m</button>
        <button class="tf-btn" data-tf="1h">1H</button>
        <button class="tf-btn" data-tf="4h">4H</button>
        <button class="tf-btn" data-tf="1d">1D</button>
    </div>
    <div class="chart-wrap" id="chart"></div>
    <div class="bottom">
        <span>Connected to Binance</span>
        <span id="update-time">--</span>
    </div>

    <script>
        const chartDiv = document.getElementById('chart');
        let chart, candleSeries, volSeries, lastPrice = 0, tf = '1m';

        function init() {
            chart = LightweightCharts.createChart(chartDiv, {
                width: chartDiv.clientWidth,
                height: 500,
                layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                rightPriceScale: { borderColor: '#2a2e39' },
                timeScale: { borderColor: '#2a2e39', timeVisible: true }
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#00e676', downColor: '#ff5252',
                borderUpColor: '#00e676', borderDownColor: '#ff5252',
                wickUpColor: '#00e676', wickDownColor: '#ff5252'
            });

            volSeries = chart.addHistogramSeries({
                priceFormat: { type: 'volume' },
                priceScaleId: 'vol'
            });

            chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });

            window.addEventListener('resize', () => {
                chart.applyOptions({ width: chartDiv.clientWidth });
            });

            load();
        }

        async function load() {
            try {
                const r = await fetch('/api/klines?symbol=BTCUSDT&interval=' + tf + '&limit=200');
                const data = await r.json();

                if (!Array.isArray(data)) {
                    console.error('Invalid data:', data);
                    return;
                }

                const candles = data.map(k => ({
                    time: k.time || k[0] / 1000,
                    open: k.open || +k[1],
                    high: k.high || +k[2],
                    low: k.low || +k[3],
                    close: k.close || +k[4]
                }));

                const volumes = data.map(k => ({
                    time: k.time || k[0] / 1000,
                    value: k.volume || +k[5],
                    color: (k.close || +k[4]) >= (k.open || +k[1]) ? 'rgba(0,230,118,0.3)' : 'rgba(255,82,82,0.3)'
                }));

                candleSeries.setData(candles);
                volSeries.setData(volumes);

                const price = candles[candles.length - 1].close;
                document.getElementById('btc-price').textContent = '$' + price.toLocaleString(undefined, {minimumFractionDigits:2});

                if (lastPrice > 0) {
                    const chg = ((price - lastPrice) / lastPrice * 100);
                    const el = document.getElementById('price-change');
                    el.textContent = (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%';
                    el.className = 'price-change ' + (chg >= 0 ? 'up' : 'down');
                }
                lastPrice = price;
                document.getElementById('update-time').textContent = new Date().toLocaleTimeString();
            } catch(e) {
                console.error(e);
                document.getElementById('btc-price').textContent = 'Error loading';
            }
        }

        document.querySelectorAll('.tf-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tf = btn.dataset.tf;
                load();
            });
        });

        init();
        setInterval(load, 5000);
    </script>
</body>
</html>
