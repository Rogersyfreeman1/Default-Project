<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Scheduler</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #131722;
            color: #d1d4dc;
            min-height: 100vh;
        }
        .nav {
            background: #1e222d;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e39;
        }
        .nav-brand { font-size: 20px; font-weight: bold; color: #fff; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #d1d4dc; text-decoration: none; padding: 8px 16px; border-radius: 6px; }
        .nav-links a:hover, .nav-links a.active { background: #2962ff; color: #fff; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .header h1 { font-size: 28px; color: #fff; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary { background: #2962ff; color: #fff; }
        .btn-success { background: #00e676; color: #000; }
        .btn-danger { background: #ff5252; color: #fff; }
        .scheduler-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }
        .calendar-panel {
            background: #1e222d;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #2a2e39;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .calendar-header h3 { color: #fff; }
        .calendar-nav { display: flex; gap: 10px; }
        .calendar-nav button {
            background: #2a2e39;
            border: none;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }
        .calendar-day {
            padding: 10px 5px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .calendar-day:hover { background: #2a2e39; }
        .calendar-day.today { background: #2962ff; color: #fff; }
        .calendar-day.has-schedule { background: rgba(0, 230, 118, 0.2); }
        .calendar-day.header { color: #787b86; font-size: 12px; cursor: default; }
        .calendar-day.header:hover { background: transparent; }
        .schedule-panel {
            background: #1e222d;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #2a2e39;
        }
        .schedule-list { margin-top: 20px; }
        .schedule-item {
            background: #2a2e39;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .schedule-info h4 { color: #fff; margin-bottom: 5px; }
        .schedule-info p { font-size: 13px; color: #787b86; }
        .schedule-actions { display: flex; gap: 10px; }
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #363a45;
            border-radius: 26px;
            transition: 0.3s;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background: #fff;
            border-radius: 50%;
            transition: 0.3s;
        }
        input:checked + .slider { background: #00e676; }
        input:checked + .slider:before { transform: translateX(24px); }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1e222d;
            border-radius: 12px;
            padding: 30px;
            width: 500px;
            max-width: 90%;
        }
        .modal h2 { margin-bottom: 20px; color: #fff; }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #787b86;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #2a2e39;
            border: 1px solid #363a45;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-actions .btn { flex: 1; }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-active { background: rgba(0, 230, 118, 0.2); color: #00e676; }
        .badge-paused { background: rgba(255, 152, 0, 0.2); color: #ff9800; }
        .day-checkboxes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .day-checkbox {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .day-checkbox input[type="checkbox"] {
            width: auto;
        }
        .upcoming-trades {
            background: #2a2e39;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
        .upcoming-trades h4 { margin-bottom: 10px; color: #fff; }
        .trade-slot {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #363a45;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-brand">Trading Scheduler</div>
        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/education">Learn</a>
            <a href="/journal">Journal</a>
            <a href="/scheduler" class="active">Scheduler</a>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>📅 Trading Scheduler</h1>
            <button class="btn btn-primary" onclick="openAddModal()">+ Add Schedule</button>
        </div>

        <div class="scheduler-grid">
            <div class="calendar-panel">
                <div class="calendar-header">
                    <button onclick="changeMonth(-1)">◀</button>
                    <h3 id="current-month">July 2026</h3>
                    <button onclick="changeMonth(1)">▶</button>
                </div>
                <div class="calendar-grid" id="calendar">
                </div>

                <div class="upcoming-trades">
                    <h4>Today's Schedule</h4>
                    <div id="today-schedule">
                        <div class="trade-slot">
                            <span>No schedules for today</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="schedule-panel">
                <h3 style="color:#fff;margin-bottom:15px;">Active Schedules</h3>
                <div class="schedule-list" id="schedule-list">
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="scheduleModal">
        <div class="modal-content">
            <h2>Add Trading Schedule</h2>
            <div class="form-group">
                <label>Schedule Name</label>
                <input type="text" id="modal-name" placeholder="e.g., BTC Day Trading">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Symbol</label>
                    <select id="modal-symbol">
                        <option value="BTCUSD">BTC/USD</option>
                        <option value="ETHUSD">ETH/USD</option>
                        <option value="SOLUSD">SOL/USD</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Strategy</label>
                    <select id="modal-strategy">
                        <option value="trend">Trend Following</option>
                        <option value="scalp">Scalping</option>
                        <option value="swing">Swing Trading</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Start Time</label>
                    <input type="time" id="modal-start" value="00:00">
                </div>
                <div class="form-group">
                    <label>End Time</label>
                    <input type="time" id="modal-end" value="23:59">
                </div>
            </div>
            <div class="form-group">
                <label>Trading Days</label>
                <div class="day-checkboxes">
                    <label class="day-checkbox"><input type="checkbox" value="mon" checked> Mon</label>
                    <label class="day-checkbox"><input type="checkbox" value="tue" checked> Tue</label>
                    <label class="day-checkbox"><input type="checkbox" value="wed" checked> Wed</label>
                    <label class="day-checkbox"><input type="checkbox" value="thu" checked> Thu</label>
                    <label class="day-checkbox"><input type="checkbox" value="fri" checked> Fri</label>
                    <label class="day-checkbox"><input type="checkbox" value="sat" checked> Sat</label>
                    <label class="day-checkbox"><input type="checkbox" value="sun" checked> Sun</label>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Position Size ($)</label>
                    <input type="number" id="modal-size" value="30000000">
                </div>
                <div class="form-group">
                    <label>Profit Target ($)</label>
                    <input type="number" id="modal-target" value="50000000">
                </div>
            </div>
            <div class="form-group">
                <label>Notes</label>
                <textarea id="modal-notes" placeholder="Any special instructions for this schedule..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-success" onclick="saveSchedule()">Save Schedule</button>
                <button class="btn" style="background:#363a45;color:#fff;" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let schedules = JSON.parse(localStorage.getItem('tradingSchedules') || '[]');
        let currentDate = new Date();
        let selectedDate = new Date();

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('current-month').textContent = 
                currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            let html = days.map(d => `<div class="calendar-day header">${d}</div>`).join('');
            
            for (let i = 0; i < firstDay; i++) {
                html += '<div class="calendar-day"></div>';
            }
            
            for (let d = 1; d <= daysInMonth; d++) {
                const date = new Date(year, month, d);
                const isToday = date.toDateString() === today.toDateString();
                const hasSchedule = schedules.some(s => {
                    const dayNames = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
                    return s.days.includes(dayNames[date.getDay()]);
                });
                
                let classes = 'calendar-day';
                if (isToday) classes += ' today';
                if (hasSchedule) classes += ' has-schedule';
                
                html += `<div class="${classes}" onclick="selectDate(${year}, ${month}, ${d})">${d}</div>`;
            }
            
            document.getElementById('calendar').innerHTML = html;
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function selectDate(year, month, day) {
            selectedDate = new Date(year, month, day);
            updateTodaySchedule();
        }

        function updateTodaySchedule() {
            const dayNames = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
            const todayDay = dayNames[selectedDate.getDay()];
            const todaySchedules = schedules.filter(s => s.days.includes(todayDay) && s.active);
            
            const container = document.getElementById('today-schedule');
            if (todaySchedules.length === 0) {
                container.innerHTML = '<div class="trade-slot"><span>No schedules for this day</span></div>';
            } else {
                container.innerHTML = todaySchedules.map(s => `
                    <div class="trade-slot">
                        <span>${s.name}</span>
                        <span style="color:#00e676;">${s.startTime} - ${s.endTime}</span>
                    </div>
                `).join('');
            }
        }

        function renderSchedules() {
            const container = document.getElementById('schedule-list');
            container.innerHTML = schedules.map((s, i) => `
                <div class="schedule-item">
                    <div class="schedule-info">
                        <h4>${s.name} <span class="status-badge ${s.active ? 'badge-active' : 'badge-paused'}">${s.active ? 'ACTIVE' : 'PAUSED'}</span></h4>
                        <p>${s.symbol} | ${s.strategy} | $${(s.size/1000000).toFixed(0)}M size | $${(s.target/1000000).toFixed(0)}M target</p>
                        <p>${s.startTime} - ${s.endTime} | ${s.days.join(', ')}</p>
                    </div>
                    <div class="schedule-actions">
                        <label class="toggle-switch">
                            <input type="checkbox" ${s.active ? 'checked' : ''} onchange="toggleSchedule(${i})">
                            <span class="slider"></span>
                        </label>
                        <button class="btn btn-danger" style="padding:5px 10px;font-size:12px;" onclick="deleteSchedule(${i})">Delete</button>
                    </div>
                </div>
            `).join('');
            localStorage.setItem('tradingSchedules', JSON.stringify(schedules));
        }

        function openAddModal() {
            document.getElementById('scheduleModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('scheduleModal').classList.remove('active');
        }

        function saveSchedule() {
            const days = [];
            document.querySelectorAll('.day-checkbox input:checked').forEach(cb => days.push(cb.value));
            
            const schedule = {
                id: Date.now(),
                name: document.getElementById('modal-name').value,
                symbol: document.getElementById('modal-symbol').value,
                strategy: document.getElementById('modal-strategy').value,
                startTime: document.getElementById('modal-start').value,
                endTime: document.getElementById('modal-end').value,
                days: days,
                size: parseFloat(document.getElementById('modal-size').value),
                target: parseFloat(document.getElementById('modal-target').value),
                notes: document.getElementById('modal-notes').value,
                active: true
            };
            
            schedules.push(schedule);
            renderSchedules();
            updateTodaySchedule();
            closeModal();
        }

        function toggleSchedule(index) {
            schedules[index].active = !schedules[index].active;
            renderSchedules();
            updateTodaySchedule();
        }

        function deleteSchedule(index) {
            if (confirm('Delete this schedule?')) {
                schedules.splice(index, 1);
                renderSchedules();
                updateTodaySchedule();
            }
        }

        renderCalendar();
        renderSchedules();
        updateTodaySchedule();
    </script>
</body>
</html>
